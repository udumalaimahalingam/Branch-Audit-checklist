const PERF=[["fi","Feed Intake (gm)"],["bw","Body Weight (gm)"],["fcr","FCR (Feed Intake ÷ Body Weight)"],["mort","Mortality %"],["feed","Feed Intake %"],["bwp","Body Weight %"]],FIND=[["dev","Major SOP Deviations"],["pos","Farm Positive Points"],["rec","Corrective Actions / Recommendations"]],PHT=["Farm Front View","Shed Interior","Brooding Area","Feed Storage Area","Water System","Biosecurity","Litter Condition","SOP Deviation"];

let S={branch:{},farms:[],cur:-1};
function newFarm(){return {code:"",name:"",farmer:"",date:"",age:"",gps:"",sc:{},rm:{},ph:{},sig:{}}}
function grp(f){const a=Number(f.age);return a>=1?GROUPS.find(g=>a>=g.lo&&a<=g.hi):null}
function catScore(f,ci){return categories[ci].items.reduce((t,_,ii)=>t+(Number(f.sc[ci+"-"+ii])||0),0)}
function farmCalc(f){const g=grp(f),r={g,common:{},gs:0,tot:0,max:0};if(!g)return r;[0,g.ci,4,5].forEach(ci=>{const v=catScore(f,ci);r.tot+=v;r.max+=categories[ci].max;if(ci===g.ci)r.gs=v;else r.common[ci]=v});return r}
function branchCalc(){const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,fc=S.farms.map(farmCalc),parts=[];
 COMMON.forEach(ci=>{const v=fc.filter(r=>r.g).map(r=>r.common[ci]);parts.push({name:categories[ci].name,n:v.length,avg:avg(v),max:categories[ci].max})});
 GROUPS.forEach(g=>{const v=fc.filter(r=>r.g&&r.g.ci===g.ci).map(r=>r.gs);parts.push({name:g.n+" Farm",n:v.length,avg:avg(v),max:categories[g.ci].max})});
 const total=parts.reduce((t,p)=>t+p.avg,0),max=parts.reduce((t,p)=>t+p.max,0),pct=max?Math.round(total/max*10000)/100:0;
 return {fc,parts,total,max,pct,grade:pct>=95?"A+":pct>=90?"A":pct>=80?"B":pct>=70?"C":"D",result:pct>=95?"Excellent":pct>=80?"Good":pct>=70?"Average":"Poor"}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){try{localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k==="ph"?undefined:v));$("status").textContent="Photos are too large for auto-save. Tap Save Draft to keep them."}catch(_){}}}

 if(r.g)h+=`<div class="card p-3 mb-2"><div class="fw-bold mb-2 hd" style="background:#e6f4ea">Category-wise Score</div><table class="table table-sm mb-0">${[0,r.g.ci,4,5].map(ci=>`<tr><td>${esc(categories[ci].name)}</td><td class="text-end" id="cw-${ci}"></td></tr>`).join("")}<tr class="fw-bold"><td>Farm Total</td><td class="text-end" id="cw-t"></td></tr></table></div>`;
 h+=`<div class="card p-3 mb-2"><div class="fw-bold mb-2 hd" style="background:#f3e8fd">Production Performance Data</div><div class="row g-2">${PERF.map(p=>`<div class="col-6"><label class="form-label sm mb-0">${p[1]}</label><input type="number" inputmode="decimal" step="any" class="form-control form-control-sm" data-f="${p[0]}" value="${esc(f[p[0]])}" ${p[0]==="fcr"?'readonly style="background:#eef3ef;font-weight:600" placeholder="Auto"':""}></div>`).join("")}</div></div>`;
 h+=`<div class="card p-3 mb-2"><div class="fw-bold mb-2 hd" style="background:#fff8cc">Findings and Feedback</div>${FIND.map(p=>`<label class="form-label sm mb-0">${p[1]}</label><textarea class="form-control form-control-sm mb-2" rows="3" data-f="${p[0]}">${esc(f[p[0]])}</textarea>`).join("")}</div>`;
 h+=`<div class="card p-3 mb-2"><div class="fw-bold mb-2 hd" style="background:#e0f2f1">Audit Evidence Photos</div>${PHT.map((t,i)=>`<div class="mb-2"><div class="small fw-semibold">${t}</div><input type="file" accept="image/*" multiple class="form-control form-control-sm" data-p="${i}"><div class="d-flex flex-wrap gap-2 mt-1" id="ph-${i}"></div></div>`).join("")}</div>`;
 h+=`<div class="card p-3 mb-3"><div class="fw-bold mb-2 hd" style="background:#fde7e9">Digital Signatures</div>${[["a","Auditor"],["f","Farmer"]].map(([k,l])=>`<div class="small fw-semibold">${l} Signature</div><canvas data-sg="${k}" style="width:100%;height:130px;border:1px dashed #8da895;border-radius:8px;background:#fff;touch-action:none"></canvas><button class="btn btn-sm btn-outline-secondary mt-1 mb-2" data-clr="${k}">Clear</button>`).join("")}</div>`;
 h+=`<button class="btn btn-sm btn-outline-danger" id="delFarm">Remove this farm</button>`;$("view").innerHTML=h;refresh();PHT.forEach((_,i)=>thumbs(i));sigInit()}
function thumbs(i){const f=S.farms[S.cur],el=$("ph-"+i);if(!el)return;el.innerHTML=((f.ph||{})[i]||[]).map((p,j)=>`<div class="text-center"><img src="${p.data}" style="height:64px;border-radius:6px"><br><button class="btn btn-sm btn-link text-danger p-0" data-rm="${i}-${j}">remove</button></div>`).join("")}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res({name:file.name,data:c.toDataURL("image/jpeg",.6)})};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
function sigInit(){const f=S.farms[S.cur];f.sig=f.sig||{};document.querySelectorAll("canvas[data-sg]").forEach(c=>{const k=c.dataset.sg,w=c.clientWidth;c.width=w*2;c.height=260;const x=c.getContext("2d");x.scale(2,2);x.lineWidth=2;x.lineCap="round";x.strokeStyle="#111";
 if(f.sig[k]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,w,130);im.src=f.sig[k]}
 let dn=false;const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{dn=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
 c.onpointermove=e=>{if(!dn)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
 c.onpointerup=()=>{if(!dn)return;dn=false;f.sig[k]=c.toDataURL("image/png");save()}})}
function refresh(){const f=S.farms[S.cur];if(!f)return;const r=farmCalc(f);if(!r.g)return;[0,r.g.ci,4,5].forEach(ci=>$("cs-"+ci).textContent=fmt(catScore(f,ci))+" / "+categories[ci].max);$("ftot").textContent="Farm score: "+fmt(r.tot)+" / "+r.max;[0,r.g.ci,4,5].forEach(ci=>$("cw-"+ci).textContent=fmt(catScore(f,ci))+" / "+categories[ci].max);$("cw-t").textContent=fmt(r.tot)+" / "+r.max}
function renderSum(){const B=branchCalc();let h=`<div class="card p-3 mb-3"><div class="fw-bold mb-2 hd" style="background:#eaf4d9">Farm-wise Scores</div><div class="table-responsive"><table class="table table-sm"><thead><tr><th>#</th><th>Farm</th><th>Group</th><th>Shed</th><th>Select.</th><th>Feedb.</th><th>Age-group</th><th>Total</th></tr></thead><tbody>`;
 B.fc.forEach((r,i)=>{const f=S.farms[i];h+=r.g?`<tr><td>${i+1}</td><td>${esc(f.code||f.name||"-")}</td><td>${r.g.n}</td><td>${fmt(r.common[0])}</td><td>${fmt(r.common[4])}</td><td>${fmt(r.common[5])}</td><td>${fmt(r.gs)}</td><td><b>${fmt(r.tot)}/${r.max}</b></td></tr>`:`<tr><td>${i+1}</td><td>${esc(f.code||f.name||"-")}</td><td colspan="6" class="sm">Bird age not entered</td></tr>`});
 h+=`</tbody></table></div></div><div class="card p-3 mb-3"><div class="fw-bold mb-2 hd" style="background:#e8ebf5">Branch Average Summary</div><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Category</th><th>Farms</th><th>Average</th><th>Max</th></tr></thead><tbody>`+B.parts.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.n}</td><td>${p.n?fmt(p.avg):'<span class="text-danger">none</span>'}</td><td>${p.max}</td></tr>`).join("")+`</tbody></table></div>
 <div class="fs-5">Branch Score: <b>${fmt(B.total)} / ${B.max}</b> (${B.pct}%) · Grade <b>${B.grade}</b> · ${B.result}</div>${B.parts.some(p=>!p.n)?'<div class="sm text-danger">A group with no farms counts as 0 in the branch score.</div>':""}</div>`;$("view").innerHTML=h}
async function dl(blob,name){const u=URL.createObjectURL(blob);try{const a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},60000)}catch(e){try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(_){}window.open(u,"_blank")}}
const safe=s=>String(s||"NA").replace(/[^a-z0-9_-]+/gi,"_").replace(/^_+|_+$/g,"")||"NA";
const base=()=>"BranchAudit_"+safe(S.branch.branch)+"_"+(S.branch.date||new Date().toISOString().slice(0,10));
const stamp=()=>new Date().toTimeString().slice(0,8).replace(/:/g,"");
function csv(){const B=branchCalc(),q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',rows=[["Farm No","Farm Code","Farm Name","Village","Age (days)","Group","Shed Cleaning","Farm Selection","Farmer Feedback","Age-group Score","Total","Max",...PERF.map(p=>p[1])]];
 B.fc.forEach((r,i)=>{const f=S.farms[i];rows.push([i+1,f.code,f.name,f.farmer,f.age,r.g?r.g.n:"",r.g?r.common[0]:"",r.g?r.common[4]:"",r.g?r.common[5]:"",r.g?r.gs:"",r.g?r.tot:"",r.g?r.max:"",...PERF.map(p=>f[p[0]]??"")])});
 rows.push([],["Category","Farms","Average","Max"]);B.parts.forEach(p=>rows.push([p.name,p.n,fmt(p.avg),p.max]));rows.push(["BRANCH TOTAL","",fmt(B.total),B.max],["Percentage","",B.pct],["Grade","",B.grade],["Result","",B.result]);
 dl(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}),base()+"_summary.csv")}
async function pdf(){if(!(window.jspdf&&window.jspdf.jsPDF)){alert("PDF tool not loaded. Open the app once with internet.");return}
 const B=branchCalc();if(!B.fc.some(r=>r.g)){alert("Add at least one farm and enter its bird age.");return}
 const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),m=14,H={fillColor:[20,83,45]},b=S.branch,mg={left:m,right:m};
 const head=t=>{try{d.addImage(LOGO,"PNG",m,10,22,15)}catch(e){}d.setFont("helvetica","bold");d.setFontSize(15);d.text("SUGUNA FOODS PVT LTD",m+27,16);d.setFontSize(11);d.text(t,m+27,23)};
 head("Branch Farm SOP Audit Summary");
 d.autoTable({startY:30,head:[["Branch Details",""]],body:[["Region",b.region||""],["Branch",b.branch||""],["BM Name",b.bm||""],["ETS Name",b.ets||""],["Auditor",b.auditor||""],["Audit Date",b.date||""],["Farms audited",S.farms.length]],headStyles:H,styles:{fontSize:8},margin:mg});
 d.autoTable({startY:d.lastAutoTable.finalY+6,head:[["Category","Farms","Average","Max"]],body:[...B.parts.map(p=>[p.name,p.n,fmt(p.avg),p.max]),["BRANCH TOTAL","",fmt(B.total),B.max],["Percentage / Grade / Result","",B.pct+"% · "+B.grade,B.result]],headStyles:H,styles:{fontSize:8},margin:mg});
 d.autoTable({startY:d.lastAutoTable.finalY+6,head:[["#","Farm","Age","Group","Shed","Select.","Feedb.","Age-grp","Total"]],body:B.fc.map((r,i)=>{const f=S.farms[i];return r.g?[i+1,f.code||f.name,f.age,r.g.n,fmt(r.common[0]),fmt(r.common[4]),fmt(r.common[5]),fmt(r.gs),fmt(r.tot)+"/"+r.max]:[i+1,f.code||f.name,f.age,"-","","","","",""]}),headStyles:H,styles:{fontSize:8},margin:mg});
 S.farms.forEach((f,i)=>{const r=B.fc[i];if(!r.g)return;d.addPage();head("Farm "+(i+1)+" · "+r.g.n+" Farm Audit");
  d.autoTable({startY:30,body:[["Farm Code / Name",(f.code||"")+" / "+(f.name||"")],["Village",f.farmer||""],["Hatch Date / Bird Age",(f.date||"")+" / "+f.age+" days"],["GPS",f.gps||""],["Farm Score",fmt(r.tot)+" / "+r.max]],styles:{fontSize:8},margin:mg});
  d.autoTable({startY:d.lastAutoTable.finalY+4,head:[["Category-wise Score","Score","Max"]],body:[0,r.g.ci,4,5].map(ci=>[categories[ci].name,fmt(catScore(f,ci)),categories[ci].max]),headStyles:H,styles:{fontSize:8},margin:mg});
  const rows=[];[0,r.g.ci,4,5].forEach(ci=>{rows.push([{content:categories[ci].name+"  ("+fmt(catScore(f,ci))+" / "+categories[ci].max+")",colSpan:4,styles:{fontStyle:"bold",fillColor:[225,238,228]}}]);categories[ci].items.forEach((it,ii)=>rows.push([it[0],fmt(Number(f.sc[ci+"-"+ii])||0),it[1],f.rm[ci+"-"+ii]||""]))});
  d.autoTable({startY:d.lastAutoTable.finalY+4,head:[["Evaluation Point","Score","Max","Remarks"]],body:rows,headStyles:H,styles:{fontSize:7},columnStyles:{0:{cellWidth:80},1:{cellWidth:14},2:{cellWidth:12}},margin:mg});
  d.autoTable({startY:d.lastAutoTable.finalY+4,head:[["Production Performance","Value"]],body:PERF.map(p=>[p[1],f[p[0]]||""]),headStyles:H,styles:{fontSize:8},margin:mg});
  d.autoTable({startY:d.lastAutoTable.finalY+4,head:[["Findings and Feedback",""]],body:FIND.map(p=>[p[1],f[p[0]]||"-"]),headStyles:H,styles:{fontSize:8},columnStyles:{0:{cellWidth:45}},margin:mg});
  let y=d.lastAutoTable.finalY+8;if(y>255){d.addPage();y=15}
  d.setFont("helvetica","bold");d.setFontSize(9);d.text("Auditor Signature",m,y);d.text("Farmer Signature",m+90,y);
  [["a",m],["f",m+90]].forEach(([k,x])=>{if(f.sig&&f.sig[k]){try{d.addImage(f.sig[k],"PNG",x,y+2,45,15)}catch(e){}}else d.line(x,y+15,x+45,y+15)});
  let py=0,first=true;PHT.forEach((t,ti)=>{const L=(f.ph||{})[ti]||[];if(!L.length)return;if(first||py>235){d.addPage();py=15;first=false}
   d.setFont("helvetica","bold");d.setFontSize(10);d.text(t+" - Farm "+(i+1),m,py);py+=4;
   L.forEach((p,j)=>{if(j%2===0&&j>0)py+=58;if(py>240){d.addPage();py=15}try{const pr=d.getImageProperties(p.data);let w=88,h=w*pr.height/pr.width;if(h>55){h=55;w=h*pr.width/pr.height}d.addImage(p.data,"JPEG",m+(j%2)*92,py,w,h)}catch(e){}});py+=60})});
 await dl(d.output("blob"),base()+".pdf");$("status").textContent="PDF saved to Downloads at "+new Date().toLocaleTimeString()}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.tab){const v=t.dataset.tab;if(v==="add"){S.farms.push(newFarm());S.cur=S.farms.length-1}else S.cur=v==="sum"?-1:Number(v);save();render();window.scrollTo(0,0)}
 else if(t.dataset.rm){const[i,j]=t.dataset.rm.split("-");S.farms[S.cur].ph[i].splice(Number(j),1);thumbs(i);save()}
 else if(t.dataset.clr){const k=t.dataset.clr,c=document.querySelector('canvas[data-sg="'+k+'"]');c.getContext("2d").clearRect(0,0,c.width,c.height);S.farms[S.cur].sig[k]="";save()}
 else if(t.id==="delFarm"){if(confirm("Remove farm "+(S.cur+1)+" and its data?")){S.farms.splice(S.cur,1);S.cur=-1;save();render()}}
 else if(t.id==="gpsBtn"){const st=$("gpsSt"),f=S.farms[S.cur];if(!navigator.geolocation){st.textContent="GPS not available. Type coordinates.";return}st.textContent="Getting location…";
  const ok=p=>{f.gps=p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6);document.querySelector('[data-f="gps"]').value=f.gps;st.textContent="Captured (±"+Math.round(p.coords.accuracy)+" m)";save()},bad=er=>{st.textContent=er.code===1?"Location blocked. Allow Location for this site, or type coordinates.":"Location unavailable. Try again or type coordinates."};
  navigator.geolocation.getCurrentPosition(ok,er=>er.code===1?bad(er):navigator.geolocation.getCurrentPosition(ok,bad,{timeout:20000,maximumAge:300000}),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
 else if(t.id==="saveBtn"){save();await dl(new Blob([JSON.stringify(S)],{type:"application/json"}),base()+"_DRAFT_"+stamp()+".json");$("status").textContent="Draft saved to Downloads at "+new Date().toLocaleTimeString()}
 else if(t.id==="pdfBtn")pdf();else if(t.id==="csvBtn")csv();
 else if(t.id==="resetBtn"&&confirm("Clear ALL farms and branch details? Save a draft first if needed.")){S={branch:{},farms:[],cur:-1};save();loadBranch();render()}});
document.addEventListener("input",e=>{const t=e.target,f=S.farms[S.cur];
 if(t.dataset.b){S.branch[t.dataset.b]=t.value;save();return}if(!f)return;
 if(t.dataset.f&&t.dataset.f!=="age"){f[t.dataset.f]=t.value;if(t.dataset.f==="fi"||t.dataset.f==="bw"){const a=Number(f.fi),b=Number(f.bw);f.fcr=a>0&&b>0?(a/b).toFixed(2):"";const e=document.querySelector('[data-f="fcr"]');if(e)e.value=f.fcr}save()}
 else if(t.dataset.s){const v=Number(t.value),mx=Number(t.max);t.classList.toggle("is-invalid",t.value!==""&&(v<0||v>mx));f.sc[t.dataset.s]=t.value===""?0:Math.min(Math.max(v,0),mx);refresh();save()}
 else if(t.dataset.r){f.rm[t.dataset.r]=t.value;save()}});
document.addEventListener("change",async e=>{const t=e.target,f=S.farms[S.cur];if(!f)return;if(t.dataset.p!==undefined){const i=t.dataset.p;f.ph=f.ph||{};f.ph[i]=f.ph[i]||[];for(const fl of t.files){const p=await shrink(fl);if(p)f.ph[i].push(p)}t.value="";thumbs(i);save();return}if(t.dataset.f==="age"){f.age=t.value;save();render()}else if(t.dataset.s){t.value=f.sc[t.dataset.s];t.classList.remove("is-invalid")}});
$("loadIn").addEventListener("change",e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.farms))throw 0;S=d;S.cur=-1;save();loadBranch();render();$("status").textContent="Draft loaded: "+fl.name}catch(x){alert("This is not a valid branch draft file.")}};r.readAsText(fl);e.target.value=""});
function loadBranch(){document.querySelectorAll("[data-b]").forEach(el=>el.value=S.branch[el.dataset.b]||"")}
try{const sv=localStorage.getItem(KEY);if(sv){const d=JSON.parse(sv);if(Array.isArray(d.farms))S=d}}catch(e){}
if(!S.branch.date)S.branch.date=new Date().toISOString().slice(0,10);
if(!S.farms.length){S.farms.push(newFarm());S.cur=0}
loadBranch();render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
